name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth: read the version out of the build so the CI
  # toolchain can never drift from what the project declares.
  GRADLE_VERSION: 8.7

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project ships no Gradle wrapper, so the action installs the pinned
      # Gradle itself and caches ~/.gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          validate-wrappers: false

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      # Lint is advisory: a new warning should not block the APK download.
      - name: Lint
        continue-on-error: true
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      # No artifact upload: the debug APK ships straight to the releases page
      # as a rolling pre-release, so it can be downloaded straight from the
      # browser without signing keys.
      - name: Publish debug APK as pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug
          name: Debug build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic debug build of `main` at `${{ github.sha }}`.

            Installed straight from the browser; it is not signed with a release
            key, so uninstall any previous build before installing this one.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
